# Render Blueprint: deploys the whole Hearthline stack on Render's free tier.
# Secrets marked `sync: false` are entered once in the Render dashboard (never committed).
#
# Free-tier limits we design around (see PLAN.md section 14):
# - Free web services sleep after ~15 min idle (first request then takes ~1 min).
# - Background workers and cron jobs are paid-only, so background jobs run inside hearthline-api
#   (FastAPI background tasks) for now. Photos are stored in Postgres (no object storage).
# - Free Postgres is deleted 30 days after creation: create it close to the submission date
#   or upgrade it before judging (runs to Dec 15).

services:
  - type: web
    name: hearthline-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Free plans have no pre-deploy step, so migrations and the demo seed run at start-up.
    startCommand: uv run --no-dev alembic upgrade head && uv run --no-dev python -m app.seed && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hearthline-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODELS
        value: gemini:gemini-flash-lite-latest,gemini:gemma-4-31b-it,openrouter:google/gemma-4-31b-it:free,openrouter:openrouter/free
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      # The web app's service name (Render gives the private-network name, e.g. hearthline-web; the API adds
      # .onrender.com), for links the API hands out: PayPal return pages, Log in with PayPal.
      - key: WEB_HOST
        fromService:
          type: web
          name: hearthline-web
          property: host

  - type: web
    name: hearthline-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The API's service name; the web app adds .onrender.com (src/api.ts).
      - key: VITE_API_HOST
        fromService:
          type: web
          name: hearthline-api
          property: host
      # AG Grid Enterprise license (from the sponsor). Without it the grids run in trial mode with a watermark.
      - key: VITE_AG_GRID_LICENSE
        sync: false

databases:
  - name: hearthline-db
    plan: free
    databaseName: hearthline
    user: hearthline
