[project]
name = "hearthline-api"
version = "0.1.0"
description = "Hearthline disaster recovery platform: API and worker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "channel3-sdk>=4.1.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "mcp>=2.3.0",
    "openai>=3.26.0",
    "paypal-server-sdk>=2.4.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
